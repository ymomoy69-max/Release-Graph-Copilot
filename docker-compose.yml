services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://rgc:rgc@db:5432/releasegraph
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rgc
      POSTGRES_PASSWORD: rgc
      POSTGRES_DB: releasegraph
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgc -d releasegraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  demo-services:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "8081:8081"
