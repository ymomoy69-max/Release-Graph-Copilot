name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: RGC engine tests
        run: python -m pytest -q tests --ignore=tests/test_platform_api.py
      - name: Platform API tests
        run: python -m pytest -q tests/test_platform_api.py tests/test_risk_engine.py
