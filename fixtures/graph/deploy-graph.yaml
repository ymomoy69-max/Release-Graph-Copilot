nodes:
  - id: gateway
    role: gateway
  - id: app-backend
    role: backend
  - id: infra
    role: infrastructure
  - id: frontend
    role: ui
  - id: rules-engine
    role: rules
  - id: data-pipeline
    role: etl
edges:
  - from: gateway
    to: app-backend
    relation: must_deploy_before
  - from: app-backend
    to: infra
    relation: must_deploy_before
  - from: infra
    to: frontend
    relation: triggers
  - from: frontend
    to: rules-engine
    relation: depends_on
  - from: rules-engine
    to: data-pipeline
    relation: feeds
