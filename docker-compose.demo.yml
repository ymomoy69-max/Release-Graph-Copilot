# E-commerce demo microservices (simulator)
services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.product.app:app --host 0.0.0.0 --port 8101
    environment:
      SERVICE_NAME: product-service
    ports: ["8101:8101"]

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.inventory.app:app --host 0.0.0.0 --port 8102
    environment:
      SERVICE_NAME: inventory-service
    ports: ["8102:8102"]

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.payment.app:app --host 0.0.0.0 --port 8103
    environment:
      SERVICE_NAME: payment-service
    ports: ["8103:8103"]

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.notification.app:app --host 0.0.0.0 --port 8105
    environment:
      SERVICE_NAME: notification-service
    ports: ["8105:8105"]

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.order.app:app --host 0.0.0.0 --port 8104
    environment:
      SERVICE_NAME: order-service
      PRODUCT_SERVICE_URL: http://product-service:8101
      INVENTORY_SERVICE_URL: http://inventory-service:8102
      PAYMENT_SERVICE_URL: http://payment-service:8103
      NOTIFICATION_SERVICE_URL: http://notification-service:8105
    depends_on: [product-service, inventory-service, payment-service, notification-service]
    ports: ["8104:8104"]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.api_gateway.app:app --host 0.0.0.0 --port 8080
    environment:
      SERVICE_NAME: api-gateway
      PRODUCT_SERVICE_URL: http://product-service:8101
      INVENTORY_SERVICE_URL: http://inventory-service:8102
      PAYMENT_SERVICE_URL: http://payment-service:8103
      ORDER_SERVICE_URL: http://order-service:8104
      NOTIFICATION_SERVICE_URL: http://notification-service:8105
    depends_on: [order-service]
    ports: ["8080:8080"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: uvicorn demo.ecommerce.services.frontend.app:app --host 0.0.0.0 --port 8082
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on: [api-gateway]
    ports: ["8082:8082"]
