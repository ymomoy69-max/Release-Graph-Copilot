providers = ["python", "node"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
# Do not add nodejs_* here — the node provider already installs Node.
# Two Node installs conflict on corepack (Railway build error).
nixPkgs = [
  "python312",
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  "/opt/venv/bin/python -m pip install --upgrade pip setuptools wheel",
  "/opt/venv/bin/python -m pip install -e .",
  "npm ci --prefix web",
]

[phases.build]
cmds = ["npm run build --prefix web"]

[start]
cmd = "/opt/venv/bin/python -m releasegraph.cli serve_api"
