# Fallback only — Railway uses Dockerfile (see railway.json).
# Kept so a manual Nixpacks deploy still builds web/ + the API.

providers = ["python", "node"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NIXPACKS_NODE_VERSION = "20"
# Vite is a devDependency; do not omit it during install/build.
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "development"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  "/opt/venv/bin/python -m pip install --upgrade pip setuptools wheel",
  "/opt/venv/bin/python -m pip install -e .",
  "test -f web/package.json",
  "cd web && npm ci --include=dev --no-audit --no-fund",
]

[phases.build]
cmds = [
  "cd web && npm run build",
  "test -f web/dist/index.html",
]

[start]
cmd = "/opt/venv/bin/python -m releasegraph.cli serve_api"
